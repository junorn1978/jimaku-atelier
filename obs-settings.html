<!DOCTYPE html>
<html lang="ja" class="is-booting" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- The OBS window (js/obs-settings-page.js), opened from the OBS tab. Its
       own window because the app window is often captured onto the stream,
       and this one shows OBS's scene names and the password field. Opened from
       the second window it carries ?ch=2: that window's accent, a (2) on the
       title (js/i18n.js), and Auto Setup makes that window's sources. -->
  <title data-i18n="obs.settings.title">OBS 連携</title>
  <link rel="icon" type="image/png" href="images/icon.png">
  <script>
    if (new URLSearchParams(location.search).get('ch') === '2') document.documentElement.dataset.ch = '2';
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- The UI faces only; this window draws no subtitles. -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@100..900&family=Noto+Sans+TC:wght@100..900&family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/subtitle-core.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/tab-obs.css">
  <link rel="stylesheet" href="css/obs-settings.css">
</head>
<body class="obs-settings-page">

  <main class="obs-window">

    <header class="obs-window-head">
      <h1 class="obs-window-title" data-i18n="obs.settings.title">OBS 連携</h1>
      <button type="button" class="icon-btn obs-help-btn" popovertarget="popover-obs-help"
              data-i18n-title="obs.help.title" title="使い方"
              data-i18n-aria-label="obs.help.title" aria-label="使い方">?</button>
      <div class="help-popover obs-help-popover" id="popover-obs-help" popover>
        <ol class="help-steps">
          <li data-i18n="obs.help.step1"></li>
          <li data-i18n="obs.help.step2"></li>
          <li data-i18n="obs.help.step3"></li>
          <li data-i18n="obs.help.step4"></li>
        </ol>
        <ul class="help-notes">
          <li data-i18n="obs.help.nestNote"></li>
        </ul>
      </div>
    </header>

    <!-- Connection: shared by both app windows, changed from either. -->
    <section class="obs-card">
      <h2 class="section-title" data-i18n="obs.settings.conn">接続</h2>
      <div class="form-row">
        <span class="form-row-label" data-i18n="obs.enabled">WebSocket に接続</span>
        <label class="toggle">
          <input type="checkbox" data-bind="obsEnabled">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </label>
      </div>
      <label class="obs-field">
        <span class="form-row-label" data-i18n="obs.url">URL</span>
        <input type="text" class="text-input" data-bind="obsUrl"
               placeholder="ws://127.0.0.1:4455"
               autocomplete="off" spellcheck="false" autocorrect="off">
      </label>
      <div class="obs-field">
        <span class="form-row-label" data-i18n="obs.password">パスワード</span>
        <div class="secret-input-wrap" data-secret-visible="false"
             data-secret-show="obs.password.show" data-secret-hide="obs.password.hide">
          <input type="text" class="text-input secret-input" data-bind="obsPassword"
                 autocomplete="off" spellcheck="false" autocorrect="off"
                 autocapitalize="off" inputmode="text">
          <button type="button" class="icon-btn secret-toggle" aria-pressed="false">
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <path d="M1 1l22 22"/>
            </svg>
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="obs-conn">
        <p class="obs-conn-status" role="status" aria-live="polite" data-phase="disabled">
          <span class="obs-conn-dot" aria-hidden="true"></span>
          <span class="obs-conn-text"></span>
        </p>
        <p class="obs-conn-hint"></p>
      </div>
    </section>

    <!-- Auto Setup writes into the user's live OBS scene, so it asks first:
         a small bubble on the button rather than a modal, a yes/no about the
         thing just clicked. -->
    <section class="obs-card">
      <h2 class="section-title" data-i18n="obs.settings.sources">字幕ソース</h2>
      <label class="obs-nest">
        <span class="toggle">
          <input type="checkbox" data-bind="obsNestSources">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </span>
        <span class="form-row-label" data-i18n="obs.nest">字幕ソースを専用シーン「RTL-Subtitles」にまとめる</span>
      </label>
      <div class="obs-card-actions">
        <button type="button" class="btn primary obs-auto-setup" id="obs-auto-setup"
                data-i18n="obs.autoSetup">OBS に自動追加</button>
      </div>
      <div class="help-popover obs-confirm-popover" id="popover-obs-confirm" popover>
        <p class="obs-confirm-text" id="obs-confirm-text"></p>
        <div class="obs-confirm-actions">
          <button type="button" class="btn" id="obs-confirm-cancel" data-i18n="obs.autoSetup.cancel">キャンセル</button>
          <button type="button" class="btn primary" id="obs-confirm-ok" data-i18n="obs.autoSetup.ok">追加する</button>
        </div>
      </div>
    </section>

    <!-- Scene link (js/obs-scene-link.js). The list is OBS's own, fetched over
         this window's connection; the rules are shared settings. -->
    <section class="obs-card">
      <h2 class="section-title" data-i18n="obs.sceneLink.title">シーン連動</h2>
      <div class="form-row">
        <span class="form-row-label" data-i18n="obs.sceneLink.enabled">シーンの切り替えで開始・停止する</span>
        <label class="toggle">
          <input type="checkbox" data-bind="obsSceneLink">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </label>
      </div>
      <p class="obs-inline-hint" data-i18n="obs.sceneLink.desc"></p>
      <div class="obs-scene-body" id="obs-scene-body" hidden>
        <div class="obs-scene-head">
          <p class="obs-inline-hint" id="obs-scene-status" aria-live="polite"></p>
          <button type="button" class="btn" id="obs-scene-refresh" data-i18n="obs.sceneLink.refresh">一覧を更新</button>
        </div>
        <ul class="obs-scene-list" id="obs-scene-list"></ul>
      </div>
    </section>

  </main>

  <script type="module" src="js/obs-settings-page.js"></script>
</body>
</html>
