<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>字幕アトリエ — Overlay</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
  <!-- The cloud outlines' heavy faces, one per subtitle language (see
       css/subtitle-display.css). Only the weight they use; each downloads
       only the slices of characters actually drawn. -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@900&family=Noto+Sans+JP:wght@900&family=Noto+Sans+TC:wght@900&family=Noto+Sans+HK:wght@900&family=Noto+Sans+SC:wght@900&family=Noto+Sans+KR:wght@900&family=Noto+Sans+Thai:wght@900&display=swap" rel="stylesheet">

  <!-- Shared with the app window (index.html + css/styles.css) — defines the
       subtitle line height and the clip heights derived from it, so both sides
       cannot drift apart. Served from the same local server that serves this
       page, so it adds no failure mode the overlay does not already have.
       OBS caches browser sources: refresh the source's cache after editing it. -->
  <link rel="stylesheet" href="css/subtitle-core.css">

  <style>
    :root { --text-align: center; }

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      height: 100%;
      font-family: "Huninn", Arial, sans-serif;
    }

    body {
      padding: 10px 20px;
      display: flex;
      flex-direction: column;
      align-items: var(--text-align);
      box-sizing: border-box;
      overflow: hidden;
    }

    .subtitle-container {
      /* The corner pictures' containing block and stacking context, as in
         css/subtitle-display.css. */
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      align-items: var(--text-align);
      text-align: var(--text-align);
      gap: 6px;
      width: 100%;
      padding-top: 10px;
    }

    .text-line {
      font-weight: bold;
      line-height: var(--sub-line-height);  /* css/subtitle-core.css */
      paint-order: stroke fill;
      animation: fadeIn 0.18s ease-out forwards;
      flex-shrink: 0;
    }
    .text-line:empty { display: none; }
    .text-line[data-hidden="1"] { display: none; }

    /* overflow strategies, mirror styles.css; clip heights from subtitle-core.css */
    .overflow-normal { overflow: visible; }
    .overflow-shrink {
      display: block;
      width: 100%;
      height: var(--sub-clip-2line);
      overflow: hidden;
      word-break: break-word;
    }
    /* source (STT) limited to one visible line: stretch to the container width
       so text wraps (and can overflow), clip to one line, JS scrolls to bottom */
    .source-1line {
      display: block;
      width: 100%;
      height: var(--sub-clip-1line);
      overflow: hidden;
      word-break: break-word;
    }

    /* Cloud outlines (js/subtitle-cloud.js), as in css/subtitle-display.css.
       The lines here shrink to their text, and the filter region is a share
       of the box, so each line pads itself sideways to hold the cloud. */
    body:not([data-outline="stroke"]) {
      --sub-line-height: 1.55;
      --sub-clip-1line: calc(var(--sub-line-height) * 1em);
      --sub-clip-2line: calc(var(--sub-line-height) * 2em);

      .text-line {
        padding-inline: 0.7em;
        font-family: var(--cloud-font, "Noto Sans"), "Noto Sans", "Noto Sans JP", "Noto Sans TC", sans-serif;
        font-weight: 900;
      }
    }
    .text-line[data-lang="ja-JP"] { --cloud-font: "Noto Sans JP"; }
    .text-line[data-lang="zh-TW"] { --cloud-font: "Noto Sans TC"; }
    .text-line[data-lang="zh-HK"],
    .text-line[data-lang="yue-Hant-HK"] { --cloud-font: "Noto Sans HK"; }
    .text-line[data-lang="zh-CN"] { --cloud-font: "Noto Sans SC"; }
    .text-line[data-lang="ko-KR"] { --cloud-font: "Noto Sans KR"; }
    .text-line[data-lang="th-TH"] { --cloud-font: "Noto Sans Thai"; }
    body[data-outline="bubble"] {
      #source   { filter: url(#sub-bubble-source); }
      #target-1 { filter: url(#sub-bubble-target1); }
      #target-2 { filter: url(#sub-bubble-target2); }
    }
    body[data-outline="gooey"] {
      #source   { filter: url(#sub-gooey-source); }
      #target-1 { filter: url(#sub-gooey-target1); }
      #target-2 { filter: url(#sub-gooey-target2); }
    }

    /* Pictures on the source line's corners (js/subtitle-deco.js), behind
       every line, as in css/subtitle-display.css. */
    .subtitle-deco {
      position: absolute;
      z-index: -1;
      height: auto;
      pointer-events: none;
      user-select: none;
    }
    .subtitle-deco[hidden] { display: none; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Hidden when empty, or the container's gap still reserves a row for it. */
    #status-msg:empty { display: none; }
    #status-msg {
      color: #ffaa00;
      font-size: 14px;
      font-weight: normal;
    }
  </style>
</head>
<body data-outline="stroke">
  <div class="subtitle-container" id="container">
    <div id="source"   class="text-line"></div>
    <div id="target-1" class="text-line"></div>
    <div id="target-2" class="text-line"></div>
    <div id="status-msg"></div>
  </div>

  <!-- type="module" so the shared subtitle motion can be imported instead of
       copied. Needs Chrome 61+; OBS has shipped CEF 103 or newer since OBS 28.
       Module scripts are deferred, which is fine — every element it touches is
       above it in the document. -->
  <script type="module">
    import { keepTailVisible, setupCinemaScroll } from './js/subtitle-render.js';
    import { installCloudFilters, updateCloudFilters, isCloudOutline } from './js/subtitle-cloud.js';
    import { mountSubtitleDeco, decoSlotName, DECO_DATA_REALM, DECO_SIDES } from './js/subtitle-deco.js';

    installCloudFilters();

    /* Hash params: #url=...&pwd=...&mode=all|source|target1|target2&ch=2 */
    const hashParams  = new URLSearchParams(location.hash.replace(/^#/, ''));
    const queryParams = new URLSearchParams(location.search);
    const wsUrl = hashParams.get('url')  || queryParams.get('url')  || 'ws://127.0.0.1:4455';
    const wsPwd = hashParams.get('pwd')  || queryParams.get('pwd')  || '';
    const mode  = hashParams.get('mode') || queryParams.get('mode') || 'all';
    /* Which app window's subtitles to draw: the second one (js/channel.js)
       makes its overlays with ch=2 and tags its events with ch: 2. Neither
       means the first, so overlays made before there was a second still work. */
    const channel = (hashParams.get('ch') || queryParams.get('ch')) === '2' ? 2 : 1;

    /* Per-mode hiding: a "target1-only" overlay shouldn't show the source line. */
    const HIDE_MAP = {
      source:  '#target-1,#target-2',
      target1: '#source,#target-2',
      target2: '#source,#target-1',
    };
    if (HIDE_MAP[mode]) {
      const s = document.createElement('style');
      s.textContent = HIDE_MAP[mode] + '{display:none!important}';
      document.head.appendChild(s);
    }

    const sourceEl = document.getElementById('source');
    const t1El     = document.getElementById('target-1');
    const t2El     = document.getElementById('target-2');
    const statusEl = document.getElementById('status-msg');

    function setStatus(text) { statusEl.textContent = text || ''; }

    /* Translation cinema scroll. The behaviour itself is in subtitle-render.js,
       shared with the app window so both move identically; this side only
       supplies where the current overflow mode comes from — here, the last
       broadcast payload rather than a settings store. */
    let lastOverflow = 'normal';
    const isShrink = () => lastOverflow === 'shrink';

    /* Arrow, not a bare reference: .map() passes (element, index, array), so
       passing setupCinemaScroll directly would hand it the index as isShrink. */
    const targetReevals = [t1El, t2El].map(el => setupCinemaScroll(el, isShrink));

    /* The corner pictures (js/subtitle-deco.js), on overlays that show the
       source line. The update names each picture by id only; the picture
       itself is read from the OBS slot the app stored it in, once per id. */
    const deco = mode === 'target1' || mode === 'target2'
      ? null
      : mountSubtitleDeco({ textEl: sourceEl, host: document.getElementById('container') });
    const decoCache    = { left: { id: '', src: '' }, right: { id: '', src: '' } };
    const decoFetching = { left: '', right: '' };
    let lastDeco = null;

    function applyDeco(info) {
      if (!deco) return;
      lastDeco = info || null;
      const config = {};
      for (const side of DECO_SIDES) {
        const s  = info?.[side];
        const id = s?.on ? String(s.id || '') : '';
        const have = !!id && decoCache[side].id === id;
        if (id && !have) fetchDeco(side, id);
        config[side] = { on: have, src: have ? decoCache[side].src : '', angle: s?.angle, size: s?.size, x: s?.x, y: s?.y };
      }
      deco.set(config);
    }

    /* The app stores the picture and sends the update back to back, and OBS
       may answer the read before the write lands: an id that does not match
       yet is tried again a few times. */
    async function fetchDeco(side, id, attempt = 0) {
      if (attempt === 0 && decoFetching[side] === id) return;
      decoFetching[side] = id;
      try {
        const res = await request('GetPersistentData', {
          realm: DECO_DATA_REALM, slotName: decoSlotName(channel, side),
        });
        const value = res?.slotValue;
        if (value?.id === id && typeof value.src === 'string') {
          decoCache[side] = { id, src: value.src };
          decoFetching[side] = '';
          applyDeco(lastDeco);
          return;
        }
      } catch { /* not connected, or no such slot yet */ }
      if (decoFetching[side] !== id) return;   // a newer picture took over
      if (attempt < 5) setTimeout(() => fetchDeco(side, id, attempt + 1), 500);
      else decoFetching[side] = '';            // the next update tries again
    }

    /* OBS WebSocket v5 auth = base64(sha256(base64(sha256(pwd+salt))+challenge)) */
    function toBase64(bytes) {
      let s = '';
      for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
      return btoa(s);
    }
    async function sha256Base64(text) {
      const data = new TextEncoder().encode(text);
      const buf  = await crypto.subtle.digest('SHA-256', data);
      return toBase64(new Uint8Array(buf));
    }
    async function buildAuthToken(password, salt, challenge) {
      if (!password || !salt || !challenge) return '';
      const secret = await sha256Base64(password + salt);
      return sha256Base64(secret + challenge);
    }

    /* cloud: a filter draws the outline (js/subtitle-cloud.js), so the
       stroke is taken off and the filters fed this line's numbers. */
    function applyStyle(el, line, style, cloud, rimWidth) {
      if (!style) return;
      if (style.color) el.style.color = style.color;
      if (cloud) {
        el.style.webkitTextStroke = '0';
        updateCloudFilters(line, {
          size:  parseFloat(style.fontSize),
          width: Number(style.bubbleSize),
          rimWidth: Number(rimWidth),
          cloud: style.strokeColor,
          rim:   style.rimColor,
        });
      } else if (style.strokeSize && style.strokeColor) {
        el.style.webkitTextStroke = `${style.strokeSize} ${style.strokeColor}`;
      }
      if (style.fontSize) el.style.fontSize = style.fontSize;
    }

    function applyOverflow(el, ov) {
      el.classList.remove('overflow-normal', 'overflow-shrink');
      el.classList.add(ov === 'shrink' ? 'overflow-shrink' : 'overflow-normal');
    }

    function updateText(el, txt) {
      const next = txt || '';
      if (el.textContent !== next) el.textContent = next;
    }

    let socket = null;
    let connected = false;

    /* Requests this page makes itself (the corner pictures), answered by
       op 7 with the same requestId. */
    const pendingRequests = new Map();
    let requestSeq = 0;
    function request(requestType, requestData) {
      return new Promise((resolve, reject) => {
        if (!socket || !connected) { reject(new Error('not connected')); return; }
        const requestId = `rtl-overlay-${++requestSeq}`;
        const timer = setTimeout(() => {
          pendingRequests.delete(requestId);
          reject(new Error('timeout'));
        }, 5000);
        pendingRequests.set(requestId, { resolve, reject, timer });
        socket.send(JSON.stringify({ op: 6, d: { requestType, requestId, requestData } }));
      });
    }
    function failPendingRequests() {
      for (const { reject, timer } of pendingRequests.values()) {
        clearTimeout(timer);
        reject(new Error('closed'));
      }
      pendingRequests.clear();
    }

    function connect() {
      if (!connected) setStatus(`Connecting to ${wsUrl} ...`);
      try {
        socket = new WebSocket(wsUrl);
      } catch (err) {
        setStatus(`WebSocket error: ${err.message}`);
        setTimeout(connect, 3000);
        return;
      }

      socket.onmessage = (event) => {
        let msg;
        try { msg = JSON.parse(event.data); } catch { return; }
        const op = msg.op;
        const d  = msg.d;

        if (op === 0) {
          /* hello → identify, requesting general events (1) so we get CustomEvent. */
          const auth = d.authentication;
          if (!auth) {
            socket.send(JSON.stringify({ op: 1, d: { rpcVersion: 1, eventSubscriptions: 1 } }));
          } else {
            buildAuthToken(wsPwd, auth.salt, auth.challenge).then(token => {
              socket.send(JSON.stringify({
                op: 1,
                d: { rpcVersion: 1, authentication: token, eventSubscriptions: 1 },
              }));
            });
          }
          return;
        }

        if (op === 2) {
          connected = true;
          setStatus('');
          return;
        }

        if (op === 7) {
          const pending = pendingRequests.get(d?.requestId);
          if (pending) {
            pendingRequests.delete(d.requestId);
            clearTimeout(pending.timer);
            if (d.requestStatus?.result) pending.resolve(d.responseData);
            else pending.reject(new Error(d.requestStatus?.comment || 'request failed'));
          }
          return;
        }

        if (op === 5
            && d.eventType === 'CustomEvent'
            && d.eventData?.type === 'rtl_subtitle_update'
            && (d.eventData.ch === 2 ? 2 : 1) === channel) {
          const data = d.eventData;

          if (data.alignment) {
            const flexAlign = data.alignment === 'left'  ? 'flex-start'
                            : data.alignment === 'right' ? 'flex-end'
                                                         : 'center';
            document.documentElement.style.setProperty('--text-align', flexAlign);
            document.getElementById('container').style.textAlign = data.alignment;
          }

          if (data.overflow) {
            applyOverflow(t1El, data.overflow);
            applyOverflow(t2El, data.overflow);
            /* Only re-arm the scroll on an actual mode change. Doing it on every
               broadcast would keep clearing the read-delay timer (source interim
               updates broadcast many times per second) so it could never fire.
               Text changes are handled by the MutationObserver instead. */
            if (data.overflow !== lastOverflow) {
              lastOverflow = data.overflow;
              targetReevals.forEach(fn => fn());
            }
          }

          if (data.showSource !== undefined) {
            sourceEl.dataset.hidden = data.showSource ? '' : '1';
          }

          if (data.sourceSingleLine !== undefined) {
            sourceEl.classList.toggle('source-1line', data.sourceSingleLine);
          }

          updateText(sourceEl, data.source);
          updateText(t1El,     data.target1);
          updateText(t2El,     data.target2);

          /* Each line's language picks its face under a cloud outline. */
          sourceEl.dataset.lang = data.langs?.source  ?? '';
          t1El.dataset.lang     = data.langs?.target1 ?? '';
          t2El.dataset.lang     = data.langs?.target2 ?? '';

          /* An app older than the cloud outlines sends no outline: plain. */
          const cloud = isCloudOutline(data.outline);
          document.body.dataset.outline = cloud ? data.outline : 'stroke';
          applyStyle(sourceEl, 'source',  data.styles?.source,  cloud, data.rimWidth);
          applyStyle(t1El,     'target1', data.styles?.target1, cloud, data.rimWidth);
          applyStyle(t2El,     'target2', data.styles?.target2, cloud, data.rimWidth);

          /* In single-line mode keep the latest line of the source in view. */
          keepTailVisible(sourceEl);

          /* An app older than the corner pictures sends no deco: none. */
          applyDeco(data.deco);
        }
      };

      socket.onerror = () => {
        if (!connected) setStatus(`Cannot connect to ${wsUrl}`);
      };

      socket.onclose = () => {
        socket = null;
        failPendingRequests();
        if (connected) {
          connected = false;
          setStatus('Reconnecting...');
        }
        setTimeout(connect, 3000);
      };
    }

    connect();
  </script>
</body>
</html>
